worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream auth_service   { server auth-service:4001; }
  upstream api_service    { server api-service:4002; }
  upstream chat_service   { server chat-service:4003; }
  upstream media_service  { server media-service:4004; }

  server {
    listen 8080;
    server_name stream.lr21.org;

    # --- Auth service ---
    location /api/auth/ {
      proxy_pass http://auth_service/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/auth/healthz {
      proxy_pass http://auth_service/healthz;
    }

    # --- API service (channels) ---
    location /api/channels {
      proxy_pass http://api_service/channels;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/channels/ {
      proxy_pass http://api_service/channels/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/channels/healthz {
      proxy_pass http://api_service/healthz;
    }

    # --- API service (live streams, community guidelines, follows) ---
    # Only these explicit public prefixes reach api-service. There is
    # deliberately NO route for /internal (service-to-service, guarded by a
    # shared secret): anything not matched here falls through to the static
    # frontend below and never reaches api-service.
    location /api/streams {
      proxy_pass http://api_service/streams;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/streams/ {
      proxy_pass http://api_service/streams/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Channel invite links: GET /api/invites/<token>, POST /api/invites/<token>/accept.
    # (Channel-scoped routes - members, invites, PATCH/DELETE - already pass
    # through /api/channels/ above; proxy_pass without a URI-modifying
    # variable forwards the method and the rest of the path untouched.)
    location /api/invites {
      proxy_pass http://api_service/invites;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/invites/ {
      proxy_pass http://api_service/invites/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/guidelines {
      proxy_pass http://api_service/guidelines;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/guidelines/ {
      proxy_pass http://api_service/guidelines/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- Elonix Hub (public trade-screenshot feed; image uploads <=5MB) ---
    # Not cached by the gateway (no proxy_cache); media responses carry their
    # own immutable Cache-Control for browsers/CDNs.
    location /api/hub/ {
      proxy_pass http://api_service/hub/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      client_max_body_size 6m;
    }

    location /api/users/ {
      proxy_pass http://api_service/users/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- Chat service file uploads (HTTP, not the Socket.IO path below) ---
    location /api/uploads/ {
      proxy_pass http://chat_service/uploads/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Uploaded files can take a moment on a slow connection.
      client_max_body_size 10m;
    }

    # --- Chat service (Socket.IO WebSocket) ---
    location /ws/chat/ {
      proxy_pass http://chat_service/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
    }

    location /ws/chat/healthz {
      proxy_pass http://chat_service/healthz;
    }

    # --- Media service (mediasoup signaling WebSocket) ---
    location /ws/media {
      proxy_pass http://media_service/ws/media;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
    }

    location /ws/media/healthz {
      proxy_pass http://media_service/healthz;
    }

    # --- Web frontend (static build) ---
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }
  }
}
